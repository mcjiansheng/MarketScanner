<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermarket Map Studio</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">RTAB-Map Offline Workflow</p>
      <h1>Supermarket Map Studio</h1>
    </div>
    <div id="job-status" class="status" role="status">就绪</div>
  </header>

  <section id="processing-progress" class="processing-progress" aria-live="polite" hidden>
    <div class="progress-labels">
      <strong id="progress-stage">等待处理</strong>
      <span id="progress-percent">0%</span>
    </div>
    <progress id="progress-bar" max="100" value="0">0%</progress>
  </section>

  <main>
    <nav class="mode-tabs" aria-label="处理模式">
      <button class="tab is-active" type="button" data-mode="single">单设备处理</button>
      <button class="tab" type="button" data-mode="multi">多设备合并</button>
    </nav>

    <section class="workbench" aria-label="地图处理工作台">
      <div class="control-panel">
        <section class="mode-panel is-active" data-panel="single" aria-label="单设备扫描输入">
          <div class="field-row">
            <label for="single-session">扫描会话</label>
            <div class="path-control">
              <input id="single-session" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="single-session" data-title="选择扫描会话">选择文件夹</button>
            </div>
          </div>
          <div class="field-row">
            <label for="single-output">输出目录</label>
            <div class="path-control">
              <input id="single-output" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="single-output" data-title="选择空输出目录">选择文件夹</button>
            </div>
          </div>
          <div class="field-row">
            <label for="single-points">可选结构点 CSV</label>
            <div class="path-control">
              <input id="single-points" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick-file="single-points" data-title="选择结构点 CSV">选择文件</button>
            </div>
          </div>
          <details id="legacy-segment-options" class="legacy-options">
            <summary>旧版分段数据兼容（仅历史扫描）</summary>
            <p>只用于导入旧版多段会话；连续流式扫描检查通过后，此区域会自动隐藏且不会参与处理。</p>
            <label class="check-row"><input id="single-auto-align" type="checkbox"> 自动对齐旧版相邻分段</label>
            <div class="stage-toolbar">
              <span>旧版分段阶段校正（可选）</span>
              <button id="add-stage" class="secondary" type="button">添加阶段</button>
            </div>
            <div id="stage-list" class="stage-list" aria-live="polite"></div>
          </details>
          <div class="button-row">
            <button id="inspect-single-session" class="secondary" type="button">检查会话</button>
            <button id="run-single" class="primary" type="button">生成单设备地图</button>
          </div>
        </section>

        <section class="mode-panel" data-panel="multi" aria-label="多设备合并输入">
          <div class="device-toolbar">
            <span>设备会话</span>
            <button id="add-device" class="secondary" type="button">添加设备</button>
          </div>
          <div id="device-list" class="device-list" aria-live="polite"></div>
          <label class="check-row"><input id="multi-common-start" type="checkbox" checked> 以公共起点建立初始对齐</label>
          <div class="field-row">
            <label for="multi-output">输出目录</label>
            <div class="path-control">
              <input id="multi-output" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="multi-output" data-title="选择空输出目录">选择文件夹</button>
            </div>
          </div>
          <button id="run-multi" class="primary full" type="button">合并多设备</button>
        </section>

        <details class="advanced-options">
          <summary>地图参数</summary>
          <div class="options-grid">
            <label class="check-row"><input id="option-offline-optimize" type="checkbox" checked>PC 离线闭环与全局优化</label>
            <label>rtabmap-reprocess（可选路径）<input id="option-reprocess-binary" type="text" spellcheck="false" placeholder="自动检测 PATH 或 build/bin"></label>
            <label>PC 工作线程<input id="option-pc-threads" type="number" value="4" min="1" max="64" step="1"></label>
            <label class="check-row"><input id="option-pc-local-staging" type="checkbox" checked>先在本机高速盘处理，再发布到输出目录</label>
            <label>GPU 计算后端<select id="option-gpu-backend"><option value="auto" selected>自动检测（推荐）</option><option value="apple_metal">Apple Metal</option><option value="nvidia_cuda">NVIDIA CUDA</option><option value="cpu">仅 CPU / OpenMP</option></select></label>
            <label>GPU helper（可选路径）<input id="option-gpu-helper" type="text" spellcheck="false" placeholder="自动检测 build-pc-*/bin"></label>
            <div id="gpu-capability" class="field-hint">正在检测 GPU...</div>
            <label>栅格分辨率 (m)<input id="option-resolution" type="number" value="0.05" min="0.01" step="0.01"></label>
            <label>轨迹半径 (m)<input id="option-trajectory-radius" type="number" value="1.25" min="0.1" step="0.05"></label>
            <input id="option-tag-snap" type="hidden" value="1.0">
            <label>水平坐标<select id="option-axes"><option value="xz">X/Z</option><option value="xy">X/Y</option></select></label>
            <label>3D 表面质量<select id="option-3d-quality"><option value="quick">快速</option><option value="detailed">详细</option><option value="maximum" selected>最高（推荐）</option></select></label>
          </div>
        </details>
      </div>

      <section class="preview-panel" aria-label="结果预览">
        <div class="preview-toolbar">
          <div class="preview-tabs" role="tablist" aria-label="预览视图">
            <button class="preview-tab is-active" type="button" data-preview="2d-color" role="tab" aria-selected="true">2D 彩色俯视</button>
            <button class="preview-tab" type="button" data-preview="2d-map" role="tab" aria-selected="false">2D 结构图</button>
            <button class="preview-tab" type="button" data-preview="3d" role="tab" aria-selected="false">3D 彩色模型</button>
          </div>
          <div class="preview-actions">
            <div id="scene-controls" class="scene-controls" hidden>
              <div class="drag-mode" role="group" aria-label="三维拖动方式">
                <button id="drag-rotate" class="view-tool is-active" type="button" aria-pressed="true">旋转</button>
                <button id="drag-pan" class="view-tool" type="button" aria-pressed="false">平移</button>
              </div>
              <label><input id="show-surface" type="checkbox" checked>彩色表面</label>
              <label><input id="show-cloud" type="checkbox">点云</label>
              <label><input id="show-trajectory" type="checkbox" checked>轨迹</label>
              <label class="point-size-control">点大小<input id="point-size" type="range" min="1" max="5" step="0.5" value="2"></label>
            </div>
            <button id="reset-view" class="secondary" type="button">重置视图</button>
            <button id="preview-fullscreen" class="secondary" type="button" aria-pressed="false">全屏预览</button>
            <button id="open-output" class="secondary" type="button" disabled>打开输出目录</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="map-canvas" aria-label="二维结构地图预览" hidden></canvas>
          <canvas id="scene-canvas" aria-label="彩色扫描预览"></canvas>
          <div id="empty-preview" class="empty-preview">等待地图结果</div>
        </div>
        <div id="preview-meta" class="preview-meta"></div>
      </section>
    </section>

    <section class="result-area" aria-label="处理结果">
      <div class="result-section">
        <h2>会话检查</h2>
        <div id="inspection" class="inspection">尚未检查会话</div>
      </div>
      <div class="result-section">
        <h2>质量复核</h2>
        <div id="review" class="review">尚无结果</div>
      </div>
      <div class="result-section">
        <h2>成果文件</h2>
        <div id="artifacts" class="artifacts">尚无结果</div>
      </div>
      <div class="result-section log-section">
        <h2>扫描与处理日志</h2>
        <div class="log-grid">
          <div>
            <h3>iPhone 扫描日志</h3>
            <div id="scan-log-summary" class="log-summary">选择扫描会话后显示</div>
            <pre id="scan-log-output" class="log-output">尚无日志</pre>
          </div>
          <div>
            <h3>PC 处理日志</h3>
            <div id="job-log-summary" class="log-summary">任务启动后显示</div>
            <pre id="job-log-output" class="log-output">尚无日志</pre>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
