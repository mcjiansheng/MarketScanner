<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermarket Map Studio</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">RTAB-Map Offline Workflow</p>
      <h1>Supermarket Map Studio</h1>
    </div>
    <div id="job-status" class="status" role="status">就绪</div>
  </header>

  <main>
    <nav class="mode-tabs" aria-label="处理模式">
      <button class="tab is-active" type="button" data-mode="map">2D 地图</button>
      <button class="tab" type="button" data-mode="stage">单设备阶段</button>
      <button class="tab" type="button" data-mode="multi">多设备合并</button>
    </nav>

    <section class="workbench" aria-label="地图处理工作台">
      <div class="control-panel">
        <section class="mode-panel is-active" data-panel="map" aria-label="2D 地图输入">
          <div class="field-row">
            <label for="map-session">扫描会话</label>
            <div class="path-control">
              <input id="map-session" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="map-session" data-title="选择扫描会话">选择文件夹</button>
            </div>
          </div>
          <div class="field-row">
            <label for="map-output">输出目录</label>
            <div class="path-control">
              <input id="map-output" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="map-output" data-title="选择空输出目录">选择文件夹</button>
            </div>
          </div>
          <div class="field-row">
            <label for="map-points">可选结构点 CSV</label>
            <div class="path-control">
              <input id="map-points" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick-file="map-points" data-title="选择结构点 CSV">选择文件</button>
            </div>
          </div>
          <label class="check-row"><input id="map-auto-align" type="checkbox"> 自动对齐相邻分段</label>
          <div class="button-row">
            <button id="inspect-map-session" class="secondary" type="button">检查会话</button>
            <button id="run-map" class="primary" type="button">生成 2D 地图</button>
          </div>
        </section>

        <section class="mode-panel" data-panel="stage" aria-label="单设备阶段输入">
          <div class="field-row">
            <label for="stage-session">扫描会话</label>
            <div class="path-control">
              <input id="stage-session" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="stage-session" data-title="选择扫描会话">选择文件夹</button>
            </div>
          </div>
          <div class="field-row">
            <label for="stage-output">输出目录</label>
            <div class="path-control">
              <input id="stage-output" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="stage-output" data-title="选择空输出目录">选择文件夹</button>
            </div>
          </div>
          <div class="field-row">
            <label for="stage-points">可选结构点 CSV</label>
            <div class="path-control">
              <input id="stage-points" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick-file="stage-points" data-title="选择结构点 CSV">选择文件</button>
            </div>
          </div>
          <div class="stage-toolbar">
            <span>阶段校正</span>
            <button id="add-stage" class="secondary" type="button">添加阶段</button>
          </div>
          <div id="stage-list" class="stage-list" aria-live="polite"></div>
          <div class="button-row">
            <button id="inspect-stage-session" class="secondary" type="button">检查会话</button>
            <button id="run-stage" class="primary" type="button">生成阶段地图</button>
          </div>
        </section>

        <section class="mode-panel" data-panel="multi" aria-label="多设备合并输入">
          <div class="device-toolbar">
            <span>设备会话</span>
            <button id="add-device" class="secondary" type="button">添加设备</button>
          </div>
          <div id="device-list" class="device-list" aria-live="polite"></div>
          <label class="check-row"><input id="multi-common-start" type="checkbox" checked> 以公共起点建立初始对齐</label>
          <div class="field-row">
            <label for="multi-output">输出目录</label>
            <div class="path-control">
              <input id="multi-output" class="path-input" type="text" spellcheck="false">
              <button class="secondary" type="button" data-pick="multi-output" data-title="选择空输出目录">选择文件夹</button>
            </div>
          </div>
          <button id="run-multi" class="primary full" type="button">合并多设备</button>
        </section>

        <details class="advanced-options">
          <summary>地图参数</summary>
          <div class="options-grid">
            <label>栅格分辨率 (m)<input id="option-resolution" type="number" value="0.05" min="0.01" step="0.01"></label>
            <label>轨迹半径 (m)<input id="option-trajectory-radius" type="number" value="1.25" min="0.1" step="0.05"></label>
            <label>价签吸附距离 (m)<input id="option-tag-snap" type="number" value="1.0" min="0.1" step="0.1"></label>
            <label>水平坐标<select id="option-axes"><option value="xz">X/Z</option><option value="xy">X/Y</option></select></label>
          </div>
        </details>
      </div>

      <section class="preview-panel" aria-label="结果预览">
        <div class="preview-toolbar">
          <div class="preview-tabs" role="tablist" aria-label="预览视图">
            <button class="preview-tab is-active" type="button" data-preview="2d" role="tab" aria-selected="true">2D</button>
            <button class="preview-tab" type="button" data-preview="3d" role="tab" aria-selected="false">3D</button>
          </div>
          <div class="preview-actions">
            <button id="reset-view" class="secondary" type="button">重置视图</button>
            <button id="open-output" class="secondary" type="button" disabled>打开输出目录</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="map-canvas" aria-label="二维地图预览"></canvas>
          <canvas id="scene-canvas" aria-label="三维扫描预览" hidden></canvas>
          <div id="empty-preview" class="empty-preview">等待地图结果</div>
        </div>
        <div id="preview-meta" class="preview-meta"></div>
      </section>
    </section>

    <section class="result-area" aria-label="处理结果">
      <div class="result-section">
        <h2>会话检查</h2>
        <div id="inspection" class="inspection">尚未检查会话</div>
      </div>
      <div class="result-section">
        <h2>质量复核</h2>
        <div id="review" class="review">尚无结果</div>
      </div>
      <div class="result-section">
        <h2>成果文件</h2>
        <div id="artifacts" class="artifacts">尚无结果</div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
