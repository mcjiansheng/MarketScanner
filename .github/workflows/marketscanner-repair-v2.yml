name: MarketScanner Repair V2

on:
  push:
    branches:
      - feature/prior-map-localization-repair-v2
      - "repair-v2-**"
  pull_request:
    paths:
      - ".github/workflows/marketscanner-repair-v2.yml"
      - ".github/marketscanner-repair-v2-wave.json"
      - "README.md"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "app/android/jni/**"
      - "app/ios/RTABMapApp/**"
      - "docs/map-assisted-localization/**"
      - "tools/PriorMap/**"
      - "tools/Qualification/**"
      - "tools/Reprocess/CMakeLists.txt"
      - "tools/Reprocess/main.cpp"
      - "tools/Reprocess/prior_map_factor_graph.cpp"
      - "tools/SupermarketMapStudio/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-safety-invariants:
    name: P0 production safety invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed production safety contracts
        run: |
          python3 -m unittest -v \
            tools.SupermarketMapStudio.tests.test_map_studio.MapStudioApiTests.test_review_transition_is_versioned_and_bounded_solver_cannot_publish \
            tools.SupermarketMapStudio.tests.test_map_studio.MapStudioApiTests.test_checkpoint_cleanup_requires_confirmation_and_exact_evidence \
            tools.PriorMap.tests.test_ios_sidecar_health_contract.IOSLocalizationSidecarHealthContractTests.test_atomic_visibility_and_copy_retention_contracts_are_explicit \
            tools.PriorMap.tests.test_ios_sidecar_health_contract.IOSLocalizationSidecarHealthContractTests.test_finalized_metadata_is_bound_to_persisted_evidence_bytes
      - name: Record P0 invariant scope
        if: always()
        shell: bash
        run: |
          {
            echo "# P0 production safety invariants"
            echo
            echo "- Head SHA: \`$(git rev-parse HEAD)\`"
            echo "- Bounded correction solver cannot publish"
            echo "- Checkpoint cleanup requires confirmation and exact CAS evidence"
            echo "- Verified provider copy never auto-deletes the local capture"
            echo "- Required persisted evidence failures block finalized metadata"
            echo "- Job result: \`${{ job.status }}\`"
          } | tee "$GITHUB_STEP_SUMMARY"

  python-and-web:
    name: Ubuntu Python, API and web contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start Ubuntu test summary
        shell: bash
        run: |
          mkdir -p ci-artifacts
          {
            echo "# MarketScanner Ubuntu validation"
            echo
            echo "- Head SHA: \`$(git rev-parse HEAD)\`"
            echo "- Python: \`$(python3 --version)\`"
            echo "- Node: \`$(node --version)\`"
            echo "- Checks: Python compile, PriorMap tests, Map Studio tests, JavaScript syntax, complete branch diff"
          } > ci-artifacts/ubuntu-summary.md
      - name: Compile Python sources
        run: python3 -m py_compile tools/PriorMap/*.py tools/Qualification/*.py tools/SupermarketMapStudio/*.py
      - name: Run PriorMap tests
        run: python3 -m unittest discover -s tools/PriorMap/tests -v
      - name: Run qualification evidence tests
        run: python3 -m unittest discover -s tools/Qualification/tests -v
      - name: Run Map Studio tests
        run: python3 -m unittest discover -s tools/SupermarketMapStudio/tests -v
      - name: Check browser JavaScript
        run: node --check tools/SupermarketMapStudio/web/app.js
      - name: Check complete branch patch whitespace
        if: always()
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$(python3 -c 'import json; print(json.load(open(".github/marketscanner-repair-v2-wave.json", encoding="utf-8"))["base_sha"])')"
          fi
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha^{commit}"; then
            echo "Unable to determine the complete branch diff base." >&2
            exit 1
          fi
          echo "Checking complete branch diff: $base_sha...HEAD"
          git diff --check "$base_sha...HEAD"
          echo "- Diff base: \`$base_sha\`" >> ci-artifacts/ubuntu-summary.md
      - name: Finalize Ubuntu test summary
        if: always()
        shell: bash
        run: |
          echo "- Job result: \`${{ job.status }}\`" >> ci-artifacts/ubuntu-summary.md
          cat ci-artifacts/ubuntu-summary.md
          cat ci-artifacts/ubuntu-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Ubuntu test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketscanner-ubuntu-summary-${{ github.run_id }}
          path: ci-artifacts/ubuntu-summary.md
          if-no-files-found: error

  windows-contracts:
    name: Windows imports and Python contracts
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # Match direct server.py execution, where its own directory is present
      # on sys.path, while retaining the repository root for tools.* imports.
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tools\SupermarketMapStudio
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Windows test summary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          $headSha = git rev-parse HEAD
          $pythonVersion = python --version
          @(
            "# MarketScanner Windows validation"
            ""
            "- Head SHA: ``$headSha``"
            "- Python: ``$pythonVersion``"
            "- Checks: store/server imports, PriorMap tests, Map Studio tests"
          ) | Out-File -FilePath ci-artifacts/windows-summary.md -Encoding utf8
      - name: Import Windows-sensitive modules
        run: |
          python -c "import tools.PriorMap.localized_output_store"
          python -c "import tools.SupermarketMapStudio.server"
      - name: Run PriorMap tests on Windows
        run: python -m unittest discover -s tools/PriorMap/tests -v
      - name: Run Windows stable-read metadata representation contract
        run: python -m unittest tools.Qualification.tests.test_qualification.QualificationTests.test_stable_read_accepts_windows_path_handle_stat_representation -v
      - name: Run Windows transient swap-and-restore contract
        run: python -m unittest tools.Qualification.tests.test_qualification.QualificationTests.test_stable_read_rejects_transient_same_size_swap_and_restore -v
      - name: Run qualification evidence tests on Windows
        shell: pwsh
        run: |
          $logPath = "ci-artifacts/windows-qualification.log"
          python -m unittest discover -s tools/Qualification/tests -v 2>&1 | Tee-Object -FilePath $logPath
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content $logPath -Tail 100) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Qualification Failure::$escaped"
            exit $testExit
          }
      - name: Run Map Studio tests on Windows
        shell: pwsh
        run: |
          $logPath = "ci-artifacts/windows-map-studio.log"
          python -m unittest discover -s tools/SupermarketMapStudio/tests -v 2>&1 | Tee-Object -FilePath $logPath
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content $logPath -Tail 40) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Map Studio Failure::$escaped"
            exit $testExit
          }
      - name: Finalize Windows test summary
        if: always()
        shell: pwsh
        run: |
          "- Job result: ``${{ job.status }}``" | Out-File -FilePath ci-artifacts/windows-summary.md -Append -Encoding utf8
          Get-Content ci-artifacts/windows-summary.md
          Get-Content ci-artifacts/windows-summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketscanner-windows-summary-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error

  windows-native-clean-build:
    name: Windows clean native release build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install hash-pinned Windows native dependencies
        uses: ./.github/actions/install-windows-deps
      - name: Fresh configure from the Windows release preset
        shell: pwsh
        run: |
          cmake --fresh --preset marketscanner-windows-release `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_EXPORT_PATH/installed" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_EXPORT_PATH/scripts/buildsystems/vcpkg.cmake"
      - name: Build reprocess and factor helper from the empty build tree
        run: cmake --build --preset marketscanner-windows-release --parallel 2
      - name: Verify source-bound binary versions
        shell: pwsh
        run: |
          $expected = git rev-parse HEAD
          $reprocess = "build/marketscanner-windows-release/bin/rtabmap-reprocess.exe"
          $factor = "build/marketscanner-windows-release/bin/rtabmap-prior-map-factor-graph.exe"
          & $reprocess --version | Tee-Object -FilePath reprocess-version.txt
          & $factor --version | Tee-Object -FilePath factor-version.txt
          if (-not (Select-String -Path reprocess-version.txt -SimpleMatch "marketscanner_git_sha=$expected")) {
            throw "rtabmap-reprocess does not report the checked-out source SHA."
          }
          if (-not (Select-String -Path factor-version.txt -SimpleMatch "marketscanner_git_sha=$expected")) {
            throw "rtabmap-prior-map-factor-graph does not report the checked-out source SHA."
          }
      - name: Generate release/dependency manifest
        shell: pwsh
        run: |
          python tools/SupermarketMapStudio/release_manifest.py `
            --output marketscanner-windows-release-manifest.json `
            --git-sha "$(git rev-parse HEAD)" `
            --platform windows `
            --dependency-policy tools/SupermarketMapStudio/release_dependencies.json `
            --quality-policy tools/PriorMap/factor_graph_quality_policy.json `
            --artifact build/marketscanner-windows-release/bin/rtabmap-reprocess.exe `
            --artifact build/marketscanner-windows-release/bin/rtabmap-prior-map-factor-graph.exe
      - uses: actions/upload-artifact@v4
        with:
          name: marketscanner-windows-native-${{ github.sha }}
          path: |
            marketscanner-windows-release-manifest.json
            build/marketscanner-windows-release/bin/rtabmap-reprocess.exe
            build/marketscanner-windows-release/bin/rtabmap-prior-map-factor-graph.exe
          if-no-files-found: error

  ubuntu-native-clean-build:
    name: Ubuntu clean native release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install declared native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libboost-all-dev libeigen3-dev \
            libg2o-dev libopencv-dev libpcl-dev libsqlite3-dev zlib1g-dev
      - name: Fresh configure from the release preset
        run: cmake --fresh --preset marketscanner-linux-release
      - name: Build reprocess and factor helper from the empty build tree
        run: cmake --build --preset marketscanner-linux-release -j2
      - name: Verify source-bound binary versions
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          build/marketscanner-linux-release/bin/rtabmap-reprocess --version | tee reprocess-version.txt
          build/marketscanner-linux-release/bin/rtabmap-prior-map-factor-graph --version | tee factor-version.txt
          grep -F "marketscanner_git_sha=$expected" reprocess-version.txt
          grep -F "marketscanner_git_sha=$expected" factor-version.txt
      - name: Generate release/dependency manifest
        run: |
          python3 tools/SupermarketMapStudio/release_manifest.py \
            --output marketscanner-linux-release-manifest.json \
            --git-sha "$(git rev-parse HEAD)" \
            --platform linux \
            --dependency-policy tools/SupermarketMapStudio/release_dependencies.json \
            --quality-policy tools/PriorMap/factor_graph_quality_policy.json \
            --artifact build/marketscanner-linux-release/bin/rtabmap-reprocess \
            --artifact build/marketscanner-linux-release/bin/rtabmap-prior-map-factor-graph
      - uses: actions/upload-artifact@v4
        with:
          name: marketscanner-linux-native-${{ github.sha }}
          path: |
            marketscanner-linux-release-manifest.json
            build/marketscanner-linux-release/bin/rtabmap-reprocess
            build/marketscanner-linux-release/bin/rtabmap-prior-map-factor-graph
          if-no-files-found: error

  native-source-contracts:
    name: Native ABI source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start native test summary
        shell: bash
        run: |
          mkdir -p ci-artifacts
          {
            echo "# MarketScanner native source validation"
            echo
            echo "- Head SHA: \`$(git rev-parse HEAD)\`"
            echo "- Checks: NativeWrapper declaration/definition parity, Swift bridge calls, RTABMapApp method parity"
          } > ci-artifacts/native-summary.md
      - name: Check Swift, C wrapper and RTABMapApp symbols
        run: python3 tools/PriorMap/tests/native_symbol_contract.py
      - name: Check read-only native factor graph contract
        run: python3 tools/PriorMap/tests/factor_graph_native_contract.py
      - name: Record native source-contract scope
        shell: bash
        run: |
          {
            echo "- Static ABI symbol contract: passed"
            echo "- Translation-unit compile: delegated to the conditional Xcode build because the generated iOS native dependency bundle is not stored in Git"
          } >> ci-artifacts/native-summary.md
      - name: Finalize native test summary
        if: always()
        shell: bash
        run: |
          echo "- Job result: \`${{ job.status }}\`" >> ci-artifacts/native-summary.md
          cat ci-artifacts/native-summary.md
          cat ci-artifacts/native-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketscanner-native-summary-${{ github.run_id }}
          path: ci-artifacts/native-summary.md
          if-no-files-found: error

  ios-source-contracts:
    name: macOS and iOS source contracts
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start macOS test summary
        shell: bash
        run: |
          mkdir -p ci-artifacts
          {
            echo "# MarketScanner macOS/iOS validation"
            echo
            echo "- Head SHA: \`$(git rev-parse HEAD)\`"
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- Checks: Repair V2 Swift parse, Swift core contracts, Xcode metadata, conditional unsigned arm64 build"
          } > ci-artifacts/macos-ios-summary.md
      - name: Parse all MarketScanner Swift sources touched by Repair V2
        id: swift_parse
        run: |
          xcrun swiftc -parse \
            app/ios/RTABMapApp/SupermarketFinalizationCore.swift \
            app/ios/RTABMapApp/RecoveryLifecyclePersistenceCore.swift \
            app/ios/RTABMapApp/RecoveryLifecycleEvidenceParser.swift \
            app/ios/RTABMapApp/StrictJSONScalar.swift \
            app/ios/RTABMapApp/StrictJSONKeyUniquenessValidator.swift \
            app/ios/RTABMapApp/StrictJSONDocumentParser.swift \
            app/ios/RTABMapApp/PriorMapPackageSnapshotCore.swift \
            app/ios/RTABMapApp/PriorMapLocalizationCore.swift \
            app/ios/RTABMapApp/PriorMapLocalization.swift \
            app/ios/RTABMapApp/PriceTagLocalizationCore.swift \
            app/ios/RTABMapApp/SupermarketScanSession.swift \
            app/ios/RTABMapApp/ViewController.swift \
            app/ios/RTABMapApp/RTABMap.swift
            app/ios/RTABMapApp/MobileMapImport/CSVMapSourceImporter.swift \
            app/ios/RTABMapApp/MobileMapImport/CanonicalJSONEncoder.swift \
            app/ios/RTABMapApp/MobileMapImport/CanonicalPriorMapSource.swift \
            app/ios/RTABMapApp/MobileMapImport/ElementNormalizer.swift \
            app/ios/RTABMapApp/MobileMapImport/JSONMapSourceImporter.swift \
            app/ios/RTABMapApp/MobileMapImport/MapSourceImportCoordinator.swift \
            app/ios/RTABMapApp/MobileMapImport/MapSourceImportError.swift \
            app/ios/RTABMapApp/MobileMapImport/MapSourceImportReport.swift \
            app/ios/RTABMapApp/MobileMapImport/RFC4180CSVReader.swift \
            app/ios/RTABMapApp/MobileMapImport/SourceGeometry.swift \
            app/ios/RTABMapApp/MobileMapImport/XLSXMapSourceImporter.swift \
            app/ios/RTABMapApp/MobileMapImport/XLSXWorkbookReader.swift \
            app/ios/RTABMapApp/MobileMapImport/XLSXWorksheetReader.swift \
            app/ios/RTABMapApp/MobileMapImport/XLSXZipReader.swift \
            app/ios/RTABMapApp/MobilePriorMapCompiler/MobileDistanceFieldBuilder.swift \
            app/ios/RTABMapApp/MobilePriorMapCompiler/MobilePackageManifestBuilder.swift \
            app/ios/RTABMapApp/MobilePriorMapCompiler/MobilePreviewRenderer.swift \
            app/ios/RTABMapApp/MobilePriorMapCompiler/MobilePriorMapCompiler.swift \
            app/ios/RTABMapApp/MobilePriorMapCompiler/MobileRoadGraphBuilder.swift \
            app/ios/RTABMapApp/MobilePostProcessing/ClockCorrelationRecorder.swift \
            app/ios/RTABMapApp/MobilePostProcessing/FinalTrajectory.swift \
            app/ios/RTABMapApp/MobilePostProcessing/SE2FactorGraphCore.swift \
            app/ios/RTABMapApp/MobilePostProcessing/SE2Transform.swift \
            app/ios/RTABMapApp/MobilePostProcessing/SessionSnapshotTransaction.swift \
            app/ios/RTABMapApp/MobilePostProcessing/ShelfAssociationEngine.swift \
            app/ios/RTABMapApp/MobilePostProcessing/TagObservationResolver.swift \
            app/ios/RTABMapApp/MobileResults/MobileResultExporter.swift \
            app/ios/RTABMapApp/MobileResults/MobileWorksheets.swift \
            app/ios/RTABMapApp/MobileResults/XLSXWorkbookWriter.swift \
      - name: Run platform-independent iOS contract test
        id: swift_contracts
        run: python3 -m unittest tools.PriorMap.tests.test_prior_map.IOSCoreContractTests tools.PriorMap.tests.test_c4_session_input_snapshot -v
      - name: Validate Xcode project metadata
        id: xcode_list
        run: xcodebuild -project app/ios/RTABMapApp.xcodeproj -list
      - name: Restore traceable iOS native dependency cache
        id: ios_native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/ios/RTABMapApp/Libraries/include
            app/ios/RTABMapApp/Libraries/lib
            app/ios/RTABMapApp/Libraries/ios-dependency-manifest.json
          key: marketscanner-ios-native-${{ runner.arch }}-${{ hashFiles('app/ios/RTABMapApp/install_deps.sh', 'tools/SupermarketMapStudio/release_dependencies.json') }}
      - name: Build iOS native dependencies on cache miss
        if: steps.ios_native_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd app/ios/RTABMapApp
          bash install_deps.sh
          cd ../../..
          python3 tools/SupermarketMapStudio/ios_dependency_manifest.py \
            --libraries app/ios/RTABMapApp/Libraries \
            --output app/ios/RTABMapApp/Libraries/ios-dependency-manifest.json \
            --git-sha "$(git rev-parse HEAD)"
      - name: Verify cached or freshly built iOS dependencies
        run: |
          python3 tools/SupermarketMapStudio/ios_dependency_manifest.py \
            --verify \
            --libraries app/ios/RTABMapApp/Libraries \
            --output app/ios/RTABMapApp/Libraries/ios-dependency-manifest.json \
            --git-sha "$(git rev-parse HEAD)"
      - name: Save verified iOS native dependency cache before App link
        if: steps.ios_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/ios/RTABMapApp/Libraries/include
            app/ios/RTABMapApp/Libraries/lib
            app/ios/RTABMapApp/Libraries/ios-dependency-manifest.json
          key: marketscanner-ios-native-${{ runner.arch }}-${{ hashFiles('app/ios/RTABMapApp/install_deps.sh', 'tools/SupermarketMapStudio/release_dependencies.json') }}
      - name: Build unsigned generic arm64 iOS app
        id: ios_build
        shell: bash
        run: |
          required_dependencies=(
            app/ios/RTABMapApp/Libraries/include/rtabmap-0.23/rtabmap/core/Rtabmap.h
            app/ios/RTABMapApp/Libraries/lib/librtabmap_core.a
            app/ios/RTABMapApp/Libraries/lib/librtabmap_utilite.a
            app/ios/RTABMapApp/Libraries/lib/libopencv_core.a
            app/ios/RTABMapApp/Libraries/lib/libpcl_common.a
          )
          for dependency in "${required_dependencies[@]}"; do
            if [ ! -f "$dependency" ]; then
              echo "Missing required generated dependency: $dependency" >&2
              exit 1
            fi
          done
          xcodebuild \
            -project app/ios/RTABMapApp.xcodeproj \
            -scheme RTABMapApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MarketScannerDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "- Unsigned generic arm64 iOS build: **SUCCEEDED** (Swift and native translation units compiled and linked)" >> ci-artifacts/macos-ios-summary.md
      - name: Finalize macOS test summary
        if: always()
        shell: bash
        run: |
          {
            echo "- Swift parse step outcome: \`${{ steps.swift_parse.outcome }}\`"
            echo "- Swift core contract step outcome: \`${{ steps.swift_contracts.outcome }}\`"
            echo "- Xcode metadata step outcome: \`${{ steps.xcode_list.outcome }}\`"
            echo "- iOS dependency cache hit: \`${{ steps.ios_native_cache.outputs.cache-hit || 'false' }}\`"
            echo "- Unsigned iOS build step outcome: \`${{ steps.ios_build.outcome }}\`"
            echo "- Unsigned iOS build status: \`${{ steps.ios_build.outputs.status || 'not-run' }}\`"
            echo "- Job result: \`${{ job.status }}\`"
          } >> ci-artifacts/macos-ios-summary.md
          cat ci-artifacts/macos-ios-summary.md
          cat ci-artifacts/macos-ios-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS and iOS test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketscanner-macos-ios-summary-${{ github.run_id }}
          path: ci-artifacts/macos-ios-summary.md
          if-no-files-found: error
